<app-modal [isOpen]="true"
    [title]="isEditMode ? 'Editar producto' : 'Nuevo producto'"
    (close)="onCancel()">
    <form [formGroup]="productForm" id="productForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">

        <!-- Name -->
        <div>
            <label class="block text-sm font-medium text-body mb-1">Nombre del producto *</label>
            <input type="text" formControlName="name" placeholder="Ej. Mouse inalámbrico"
                class="w-full px-4 py-2 border border-strong rounded-lg text-sm text-main focus:outline-none focus:ring-2 focus:ring-primary-500/40 transition-all bg-input"
                [class.border-red-300]="productForm.get('name')?.invalid && productForm.get('name')?.touched">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- SKU -->
            <div>
                <label class="block text-sm font-medium text-body mb-1">
                    SKU
                    <span class="text-xs text-muted font-normal ml-1">(opcional)</span>
                </label>
                <input type="text" formControlName="sku" placeholder="Ej. WM-001"
                    class="w-full px-4 py-2 border border-strong rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/40 transition-all bg-input font-mono uppercase text-muted">
            </div>

            <!-- Barcode -->
            <div>
                <label class="block text-sm font-medium text-body mb-1">
                    Código de barras
                    <span class="text-xs text-muted font-normal ml-1">(opcional)</span>
                </label>
                <input type="text" formControlName="barcode"
                    placeholder="123456789"
                    class="w-full px-4 py-2 border border-strong rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/40 transition-all bg-input font-mono text-muted">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Cost Price -->
            <div>
                <label class="block text-sm font-medium text-body mb-1">Precio costo ({{ currencySymbol }}) *</label>
                <input type="number" formControlName="costPrice" min="0" step="0.01"
                    class="w-full px-4 py-2 border border-strong rounded-lg text-sm text-main focus:outline-none focus:ring-2 focus:ring-primary-500/40 transition-all bg-input"
                    [class.border-red-300]="productForm.get('costPrice')?.invalid && productForm.get('costPrice')?.touched">
            </div>

            <!-- Selling Price -->
            <div>
                <label class="block text-sm font-medium text-body mb-1">Precio venta ({{ currencySymbol }}) *</label>
                <input type="number" formControlName="price" min="0" step="0.01"
                    class="w-full px-4 py-2 border border-strong rounded-lg text-sm text-main focus:outline-none focus:ring-2 focus:ring-primary-500/40 transition-all bg-input"
                    [class.border-red-300]="productForm.get('price')?.invalid && productForm.get('price')?.touched">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Current Stock -->
            <div>
                <label class="block text-sm font-medium text-body mb-1">Stock actual *</label>
                <input type="number" formControlName="stock" min="0"
                    class="w-full px-4 py-2 border border-strong rounded-lg text-sm text-main focus:outline-none focus:ring-2 focus:ring-primary-500/40 transition-all bg-input"
                    [class.border-red-300]="productForm.get('stock')?.invalid && productForm.get('stock')?.touched">
            </div>

            <!-- Minimum Stock Alert -->
            <div>
                <label class="block text-sm font-medium text-body mb-1">
                    Alerta de stock bajo
                    <span class="text-xs text-muted font-normal ml-1">(opcional)</span>
                </label>
                <input type="number" formControlName="stockMin" min="0"
                    class="w-full px-4 py-2 border border-strong rounded-lg text-sm text-main focus:outline-none focus:ring-2 focus:ring-primary-500/40 transition-all bg-input">
            </div>
        </div>
    </form>

    <!-- Footer Actions -->
    <ng-container modal-footer>
        <app-button variant="secondary" (click)="onCancel()">
            Cancelar
        </app-button>
        <app-button variant="primary" (click)="onSubmit()" [disabled]="isSaving">
            @if (isSaving) {
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            Guardando...
            } @else {
            {{ isEditMode ? 'Guardar cambios' : 'Crear producto' }}
            }
        </app-button>
    </ng-container>
</app-modal>
