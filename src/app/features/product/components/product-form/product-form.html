<app-modal [isOpen]="true"
    [title]="isEditMode ? ('PRODUCT_FORM.TITLE_EDIT' | translate) : ('PRODUCT_FORM.TITLE_NEW' | translate)"
    (close)="onCancel()">
    <form [formGroup]="productForm" id="productForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">

        <!-- Name -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">{{ 'PRODUCT_FORM.NAME' | translate
                }}</label>
            <input type="text" formControlName="name" [placeholder]="'PRODUCT_FORM.NAME_PLACEHOLDER' | translate"
                class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all bg-slate-50 focus:bg-white"
                [class.border-red-300]="productForm.get('name')?.invalid && productForm.get('name')?.touched">
        </div>



        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- SKU -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">{{ 'PRODUCT_FORM.SKU' | translate
                    }}</label>
                <input type="text" formControlName="sku" [placeholder]="'PRODUCT_FORM.SKU_PLACEHOLDER' | translate"
                    class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all bg-slate-50 focus:bg-white font-mono uppercase text-slate-600">
            </div>

            <!-- Barcode -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">{{ 'PRODUCT_FORM.BARCODE' |
                    translate }}</label>
                <input type="text" formControlName="barcode"
                    [placeholder]="'PRODUCT_FORM.BARCODE_PLACEHOLDER' | translate"
                    class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all bg-slate-50 focus:bg-white font-mono text-slate-600">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Cost Price -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">{{ 'PRODUCT_FORM.COST_PRICE' |
                    translate }} ({{ currencySymbol }})
                    *</label>
                <input type="number" formControlName="costPrice" min="0" step="0.01"
                    class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all bg-slate-50 focus:bg-white"
                    [class.border-red-300]="productForm.get('costPrice')?.invalid && productForm.get('costPrice')?.touched">
            </div>

            <!-- Selling Price -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">{{ 'PRODUCT_FORM.SELLING_PRICE' |
                    translate }} ({{ currencySymbol
                    }})
                    *</label>
                <input type="number" formControlName="price" min="0" step="0.01"
                    class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all bg-slate-50 focus:bg-white"
                    [class.border-red-300]="productForm.get('price')?.invalid && productForm.get('price')?.touched">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Current Stock -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">{{ 'PRODUCT_FORM.CURRENT_STOCK' |
                    translate }}</label>
                <input type="number" formControlName="stock" min="0"
                    class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all bg-slate-50 focus:bg-white"
                    [class.border-red-300]="productForm.get('stock')?.invalid && productForm.get('stock')?.touched">
            </div>

            <!-- Minimum Stock Alert -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">{{ 'PRODUCT_FORM.LOW_STOCK_ALERT' |
                    translate }}</label>
                <input type="number" formControlName="stockMin" min="0"
                    class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all bg-slate-50 focus:bg-white">
            </div>
        </div>
    </form>

    <!-- Footer Actions -->
    <ng-container modal-footer>
        <app-button variant="secondary" (click)="onCancel()">
            {{ 'COMMON.CANCEL' | translate }}
        </app-button>
        <app-button variant="primary" (click)="onSubmit()" [disabled]="isSaving">
            @if (isSaving) {
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            {{ 'PRODUCT_FORM.SAVING' | translate }}
            } @else {
            {{ isEditMode ? ('PRODUCT_FORM.SAVE_CHANGES' | translate) : ('PRODUCT_FORM.CREATE_PRODUCT' | translate)
            }}
            }
        </app-button>
    </ng-container>
</app-modal>
