<div class="flex h-[100dvh] overflow-hidden bg-app">

    <app-sidebar class="hidden md:flex shrink-0 border-r border-medium shadow-sm z-10" />

    <div class="flex-1 flex flex-col min-w-0 pb-[72px] md:pb-0">
        <app-navbar />
        <main class="flex-1 p-4 md:p-6 overflow-y-auto w-full">
            <router-outlet />
        </main>
    </div>

    <!-- Bottom Navigation (Mobile Only) -->
    <nav
        class="md:hidden fixed bottom-0 left-0 right-0 h-[72px] bg-surface border-t border-soft flex items-center justify-around px-2 pb-safe z-50">

        <a routerLink="/" routerLinkActive="text-primary-600" [routerLinkActiveOptions]="{ exact: true }"
            #rlaDash="routerLinkActive"
            class="flex flex-col items-center justify-center gap-1 w-14 h-full text-faint hover:text-muted transition-colors">
            <lucide-icon name="layout-dashboard" [size]="22" [strokeWidth]="2"
                [class.fill-primary-100]="rlaDash.isActive"></lucide-icon>
            <span class="text-[10px] font-medium" [class.font-bold]="rlaDash.isActive">Inicio</span>
        </a>

        <a routerLink="/products" routerLinkActive="text-primary-600" #rlaProd="routerLinkActive"
            class="flex flex-col items-center justify-center gap-1 w-14 h-full text-faint hover:text-muted transition-colors">
            <lucide-icon name="box" [size]="22" [strokeWidth]="2"
                [class.fill-primary-100]="rlaProd.isActive"></lucide-icon>
            <span class="text-[10px] font-medium" [class.font-bold]="rlaProd.isActive">Stock</span>
        </a>

        <!-- FAB (Floating Action Button) for New Sale -->
        <div class="relative -top-3">
            <a routerLink="/sales/new"
                class="w-12 h-12 bg-primary-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-primary-500/30 ring-4 ring-slate-100 dark:ring-slate-800 active:scale-95 transition-transform">
                <lucide-icon name="plus" [size]="24" [strokeWidth]="2.5"></lucide-icon>
            </a>
        </div>

        <a routerLink="/sales" routerLinkActive="text-primary-600" #rlaSales="routerLinkActive"
            class="flex flex-col items-center justify-center gap-1 w-14 h-full text-faint hover:text-muted transition-colors">
            <lucide-icon name="shopping-cart" [size]="22" [strokeWidth]="2"
                [class.fill-primary-100]="rlaSales.isActive"></lucide-icon>
            <span class="text-[10px] font-medium" [class.font-bold]="rlaSales.isActive">Ventas</span>
        </a>

        <a routerLink="/settings" routerLinkActive="text-primary-600" #rlaSettings="routerLinkActive"
            class="flex flex-col items-center justify-center gap-1 w-14 h-full text-faint hover:text-muted transition-colors">
            <lucide-icon name="user" [size]="22" [strokeWidth]="2"
                [class.fill-primary-100]="rlaSettings.isActive"></lucide-icon>
            <span class="text-[10px] font-medium" [class.font-bold]="rlaSettings.isActive">Yo</span>
        </a>
    </nav>
</div>
