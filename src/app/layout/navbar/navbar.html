<header class="h-20 bg-surface border-b border-soft flex items-center justify-between px-8">

    <!-- Left section: Greeting -->
    <div class="flex items-center gap-2 text-main font-bold text-xl min-w-max">
        {{ greeting() }}
    </div>

    <!-- Middle section: Search bar (visual only) -->
    <div class="hidden md:flex flex-1 max-w-xl mx-8 relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <lucide-icon name="search" [size]="18" [strokeWidth]="2" class="text-faint"></lucide-icon>
        </div>
        <input type="text"
            [placeholder]="'NAVBAR.SEARCH_PLACEHOLDER' | translate"
            class="block w-full pl-10 pr-12 py-2.5 bg-input border border-soft rounded-full text-sm placeholder-faint text-body focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500/50 transition-all cursor-not-allowed opacity-80"
            disabled>
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
            <kbd class="hidden sm:inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium bg-card border border-medium text-faint shadow-sm">
                <span class="text-xs">⌘</span>K
            </kbd>
        </div>
    </div>

    <!-- Right section: Actions & User -->
    <div class="flex items-center gap-2 sm:gap-4 shrink-0">

        <button (click)="toggleLanguage()"
            class="p-2 rounded-full transition-colors cursor-pointer text-faint hover:text-body hover:bg-surface-hover flex items-center gap-1.5"
            title="Cambiar idioma">
            <lucide-icon name="languages" [size]="20" [strokeWidth]="2"></lucide-icon>
            <span class="text-xs font-bold uppercase">{{ languageService.currentLanguage }}</span>
        </button>

        <button (click)="themeService.toggle()"
            class="p-2 rounded-full transition-colors cursor-pointer"
            [ngClass]="themeService.isDark()
                ? 'text-yellow-400 hover:text-yellow-300 hover:bg-yellow-400/10'
                : 'text-faint hover:text-yellow-500 hover:bg-yellow-400/10'"
            [title]="themeService.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
            @if (themeService.isDark()) {
            <lucide-icon name="sun" [size]="20" [strokeWidth]="2"></lucide-icon>
            } @else {
            <lucide-icon name="moon" [size]="20" [strokeWidth]="2"></lucide-icon>
            }
        </button>

        <!-- Notification Bell (Visual only) -->
        <button class="relative p-2 rounded-full transition-colors cursor-pointer text-faint hover:text-body hover:bg-surface-hover"
            title="Notificaciones">
            <lucide-icon name="bell" [size]="20" [strokeWidth]="2"></lucide-icon>
            <!-- Badge dot -->
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-surface"></span>
        </button>

        <div class="relative flex items-center gap-3 ml-2">

            <!-- Trigger -->
            <button (click)="toggleDropdown()"
                class="flex items-center gap-3 p-1.5 rounded-full hover:bg-surface-hover hover:ring-2 hover:ring-primary-500/30 transition-all cursor-pointer focus:outline-none mb-0">

                <div
                    class="w-10 h-10 rounded-full bg-primary-soft flex items-center justify-center text-primary-soft font-bold flex-shrink-0 uppercase">
                    {{ user()?.firstName?.charAt(0) || 'U' }}{{ user()?.lastName?.charAt(0) || '' }}
                </div>

                <div class="flex flex-col text-left hidden sm:flex pr-2">
                    <span class="text-sm font-bold text-main">{{ user()?.firstName || 'User' }} {{ user()?.lastName || '' }}</span>
                    <span class="text-xs text-faint font-medium">{{ 'NAVBAR.ROLE_ADMIN' | translate }}</span>
                </div>

                <lucide-icon name="chevron-down" [size]="25" [strokeWidth]="2.5"
                    class="text-faint pr-2 transition-transform" [class.rotate-180]="showDropdown()"></lucide-icon>

            </button>

            <!-- Dropdown Menu -->
            @if (showDropdown()) {
            <div
                class="absolute right-0 top-full mt-2 w-56 bg-card rounded-xl shadow-lg border border-medium overflow-hidden z-50 py-2">

                <a routerLink="/settings" (click)="showDropdown.set(false)"
                    class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-muted hover:bg-card-hover hover:text-body transition-colors">
                    <lucide-icon name="settings" [size]="18" [strokeWidth]="2"></lucide-icon>
                    Configurar cuenta
                </a>

                <div class="h-px w-full bg-soft my-1"></div>

                <button (click)="triggerLogout(); showDropdown.set(false)"
                    class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-red-600 hover:bg-red-500/10 hover:text-red-700 transition-colors text-left">
                    <lucide-icon name="log-out" [size]="18" [strokeWidth]="2"></lucide-icon>
                    Cerrar sesión
                </button>

            </div>
            }

        </div>

    </div>

</header>

@if (showLogoutModal()) {
<app-modal [isOpen]="true" title="Cerrar sesión" (close)="cancelLogout()">
    <div class="p-6 text-muted">
        ¿Seguro que querés cerrar sesión?
    </div>
    <ng-container modal-footer>
        <div class="flex justify-end gap-3 w-full">
            <app-button variant="secondary" (click)="cancelLogout()">
                Cancelar
            </app-button>
            <app-button variant="danger" (click)="confirmLogout()">
                Cerrar sesión
            </app-button>
        </div>
    </ng-container>
</app-modal>
}
