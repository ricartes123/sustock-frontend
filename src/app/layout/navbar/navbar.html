<header class="h-20 bg-surface border-b border-soft flex items-center justify-between px-8">

    <div class="flex items-center gap-2 text-main font-bold text-xl">
        {{ greeting() }}
    </div>

    <div class="flex items-center gap-2 sm:gap-4">

        <button (click)="toggleLanguage()"
            class="p-2 rounded-full transition-colors cursor-pointer text-slate-400 hover:text-primary-600 hover:bg-primary-50 dark:hover:text-primary-400 dark:hover:bg-slate-800 flex items-center gap-1.5"
            title="Cambiar idioma">
            <lucide-icon name="languages" [size]="20" [strokeWidth]="2"></lucide-icon>
            <span class="text-xs font-bold uppercase">{{ languageService.currentLanguage }}</span>
        </button>

        <button (click)="themeService.toggle()"
            class="p-2 rounded-full transition-colors cursor-pointer"
            [ngClass]="themeService.isDark()
                ? 'text-yellow-400 hover:text-yellow-300 hover:bg-yellow-400/10'
                : 'text-slate-400 hover:text-yellow-500 hover:bg-yellow-50'"
            [title]="themeService.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
            @if (themeService.isDark()) {
            <lucide-icon name="sun" [size]="20" [strokeWidth]="2"></lucide-icon>
            } @else {
            <lucide-icon name="moon" [size]="20" [strokeWidth]="2"></lucide-icon>
            }
        </button>

        <div class="relative flex items-center gap-3">

            <!-- Trigger -->
            <button (click)="toggleDropdown()"
                class="flex items-center gap-3 p-1.5 rounded-full hover:bg-primary-50 dark:hover:bg-primary-950/50 hover:ring-2 hover:ring-primary-300 hover:ring-offset-2 dark:hover:ring-offset-slate-900 transition-all cursor-pointer focus:outline-none mb-0">

                <div
                    class="w-10 h-10 rounded-full bg-primary-100 dark:bg-primary-900/50 flex items-center justify-center text-primary-700 dark:text-primary-300 font-bold flex-shrink-0 uppercase">
                    {{ user()?.firstName?.charAt(0) || 'U' }}{{ user()?.lastName?.charAt(0) || '' }}
                </div>

                <div class="flex flex-col text-left hidden sm:flex pr-2">
                    <span class="text-sm font-bold text-main">{{ user()?.firstName || 'User' }} {{ user()?.lastName || '' }}</span>
                    <span class="text-xs text-faint font-medium">{{ user()?.email || 'admin@sustock.com' }}</span>
                </div>

                <lucide-icon name="chevron-down" [size]="25" [strokeWidth]="2.5"
                    class="text-faint pr-2 transition-transform" [class.rotate-180]="showDropdown()"></lucide-icon>

            </button>

            <!-- Dropdown Menu -->
            @if (showDropdown()) {
            <div
                class="absolute right-0 top-full mt-2 w-56 bg-card rounded-xl shadow-lg border border-soft overflow-hidden z-50 py-2">

                <a routerLink="/settings" (click)="showDropdown.set(false)"
                    class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-muted hover:bg-input hover:text-primary-700 dark:hover:text-primary-400 transition-colors">
                    <lucide-icon name="settings" [size]="18" [strokeWidth]="2"></lucide-icon>
                    Configurar cuenta
                </a>

                <div class="h-px w-full bg-soft my-1"></div>

                <button (click)="triggerLogout(); showDropdown.set(false)"
                    class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 hover:text-red-700 transition-colors text-left">
                    <lucide-icon name="log-out" [size]="18" [strokeWidth]="2"></lucide-icon>
                    Cerrar sesión
                </button>

            </div>
            }

        </div>

    </div>

</header>

@if (showLogoutModal()) {
<app-modal [isOpen]="true" title="Cerrar sesión" (close)="cancelLogout()">
    <div class="p-6 text-muted">
        ¿Seguro que querés cerrar sesión?
    </div>
    <ng-container modal-footer>
        <div class="flex justify-end gap-3 w-full">
            <app-button variant="secondary" (click)="cancelLogout()">
                Cancelar
            </app-button>
            <app-button variant="danger" (click)="confirmLogout()">
                Cerrar sesión
            </app-button>
        </div>
    </ng-container>
</app-modal>
}
