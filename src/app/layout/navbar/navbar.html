<header class="h-20 bg-white border-b border-slate-100 flex items-center justify-between px-8">

    <div class="flex items-center gap-2 text-slate-800 font-bold text-xl">
        {{ greeting() }}
    </div>

    <div class="flex items-center gap-4">

        <button class="p-2 rounded-full text-slate-400 hover:text-yellow-500 hover:bg-yellow-50 transition-colors"
            title="Cambiar tema">
            <lucide-icon name="sun" [size]="20" [strokeWidth]="2"></lucide-icon>
        </button>

        <div class="relative flex items-center gap-3">

            <!-- Trigger -->
            <button (click)="toggleDropdown()"
                class="flex items-center gap-3 p-1.5 rounded-full hover:bg-primary-50 hover:ring-2 hover:ring-primary-300 hover:ring-offset-2 transition-all cursor-pointer focus:outline-none mb-0">

                <div
                    class="w-10 h-10 rounded-full bg-primary-100 flex items-center justify-center text-primary-700 font-bold flex-shrink-0 uppercase">
                    {{ user()?.firstName?.charAt(0) || 'U' }}{{ user()?.lastName?.charAt(0) || '' }}
                </div>

                <div class="flex flex-col text-left hidden sm:flex pr-2">
                    <span class="text-sm font-bold text-slate-800">{{ user()?.firstName || 'User' }} {{ user()?.lastName
                        || '' }}</span>
                    <span class="text-xs text-slate-400 font-medium">{{ user()?.email || 'admin@sustock.com' }}</span>
                </div>

                <lucide-icon name="chevron-down" [size]="25" [strokeWidth]="2.5"
                    class="text-slate-400 pr-2 transition-transform" [class.rotate-180]="showDropdown()"></lucide-icon>

            </button>

            <!-- Dropdown Menu -->
            @if (showDropdown()) {
            <div
                class="absolute right-0 top-full mt-2 w-56 bg-white rounded-xl shadow-lg border border-slate-100 overflow-hidden z-50 py-2">

                <a routerLink="/settings" (click)="showDropdown.set(false)"
                    class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-primary-700 transition-colors">
                    <lucide-icon name="settings" [size]="18" [strokeWidth]="2"></lucide-icon>
                    Configurar cuenta
                </a>

                <div class="h-px w-full bg-slate-100 my-1"></div>

                <button (click)="triggerLogout(); showDropdown.set(false)"
                    class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-red-600 hover:bg-red-50 hover:text-red-700 transition-colors text-left">
                    <lucide-icon name="log-out" [size]="18" [strokeWidth]="2"></lucide-icon>
                    Cerrar sesión
                </button>

            </div>
            }

        </div>

    </div>

</header>

@if (showLogoutModal()) {
<app-modal [isOpen]="true" title="Cerrar sesión" (close)="cancelLogout()">
    <div class="p-6 text-slate-600">
        ¿Seguro que querés cerrar sesión?
    </div>
    <ng-container modal-footer>
        <div class="flex justify-end gap-3 w-full">
            <app-button variant="secondary" (click)="cancelLogout()">
                Cancelar
            </app-button>
            <app-button variant="danger" (click)="confirmLogout()">
                Cerrar sesión
            </app-button>
        </div>
    </ng-container>
</app-modal>
}
