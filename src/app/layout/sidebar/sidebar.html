<aside [ngClass]="isCollapsed ? 'w-20' : 'w-64'"
    class="bg-surface border-r border-soft flex flex-col h-full transition-all duration-300">

    <!-- Header / Logo Area -->
    <div class="px-6 py-6 flex items-center justify-between"
        [ngClass]="isCollapsed ? 'justify-center flex-col gap-4' : ''">
        <div class="flex items-center gap-2 overflow-hidden whitespace-nowrap">
            <img src="assets/images/logos/logo-3.png" alt="SuStock" [class]="isCollapsed ? 'h-8' : 'h-10'" class="object-contain transition-all duration-300">
            @if (!isCollapsed) {
            <div class="flex items-center">
                <span class="font-extrabold leading-tight text-xl dark:text-white">Su</span>
                <span class="font-extrabold text-primary-600 dark:text-primary-400 leading-tight text-xl">Stock</span>
            </div>
            }
        </div>

        <button (click)="toggleSidebar()"
            class="text-faint hover:text-body transition-colors p-1 rounded-md hover:bg-card-hover flex-shrink-0 cursor-pointer">
            @if (!isCollapsed) {
            <lucide-icon name="chevron-left" [size]="18" [strokeWidth]="2.5"></lucide-icon>
            }
            @if (isCollapsed) {
            <lucide-icon name="chevron-right" [size]="18" [strokeWidth]="2.5"></lucide-icon>
            }
        </button>
    </div>

    <!-- Scrollable Nav -->
    <div class="flex-1 overflow-x-hidden overflow-y-auto px-4 pb-4 styled-scrollbar flex flex-col gap-6 mt-5">

        <nav class="flex flex-col gap-1">
            @for (item of menuItems; track item.route) {
            <a [routerLink]="item.route" 
                routerLinkActive
                #rla="routerLinkActive"
                [routerLinkActiveOptions]="{ exact: item.exact || false }"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-colors duration-200"
                [ngClass]="rla.isActive ? 
                    'bg-primary-600 text-white font-medium hover:bg-primary-500' : 
                    'text-nav hover:bg-primary-50 hover:text-primary-600 dark:hover:bg-primary-500/30 dark:hover:text-primary-100'"
                [title]="isCollapsed ? (item.label | translate) : ''">
                <lucide-icon [name]="item.icon" class="flex-shrink-0" [size]="20" [strokeWidth]="2"></lucide-icon>
                @if (!isCollapsed) {
                <span class="whitespace-nowrap">{{ item.label | translate }}</span>
                }
            </a>
            }
        </nav>

        <nav class="flex flex-col gap-1 mt-auto border-t border-medium pt-4">
            @for (item of settingsItems; track item.route) {
            <a [routerLink]="item.route" 
                routerLinkActive
                #rla="routerLinkActive"
                [routerLinkActiveOptions]="{ exact: item.exact || false }"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-colors duration-200"
                [ngClass]="rla.isActive ? 
                    'bg-primary-600 text-white font-medium hover:bg-primary-500' : 
                    'text-nav hover:bg-primary-50 hover:text-primary-600 dark:hover:bg-primary-500/30 dark:hover:text-primary-100'"
                [title]="isCollapsed ? (item.label | translate) : ''">
                <lucide-icon [name]="item.icon" class="flex-shrink-0" [size]="20" [strokeWidth]="2"></lucide-icon>
                @if (!isCollapsed) {
                <span class="whitespace-nowrap">{{ item.label | translate }}</span>
                }
            </a>
            }
        </nav>
    </div>
</aside>
