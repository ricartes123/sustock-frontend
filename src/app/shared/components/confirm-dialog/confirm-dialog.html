@if (visible) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity" (click)="onCancel()"></div>

    <div role="alertdialog" aria-modal="true" aria-labelledby="confirm-dialog-title"
        aria-describedby="confirm-dialog-message"
        class="relative w-full max-w-md transform overflow-hidden rounded-2xl bg-card p-6 text-left align-middle shadow-xl transition-all border border-red-500/20">
        <div class="flex items-center gap-4 mb-4 text-red-600">
            <div
                class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-red-500/15 sm:h-10 sm:w-10">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 class="text-xl font-medium leading-6 text-main" id="confirm-dialog-title">
                {{ title }}
            </h3>
        </div>

        @if (detail) {
        <p class="mt-2 rounded-lg bg-card-hover border border-soft px-3 py-2 text-sm font-semibold text-main">
            {{ detail }}
        </p>
        }

        <p class="mt-3 text-md text-muted" id="confirm-dialog-message">
            {{ message }}
        </p>

        <div class="mt-8 flex flex-col-reverse sm:flex-row sm:justify-end gap-3">
            <app-button #cancelButton variant="secondary" (click)="onCancel()" [disabled]="isLoading">
                {{ cancelLabel }}
            </app-button>
            <app-button variant="danger" (click)="onConfirm()" [disabled]="isLoading">
                {{ isLoading ? 'Procesando...' : confirmLabel }}
            </app-button>
        </div>
    </div>
</div>
}
