@if (visible) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity" (click)="onCancel()"></div>

    <!-- Modal -->
    <div
        class="relative w-full max-w-md transform overflow-hidden rounded-2xl bg-white p-6 text-left align-middle shadow-xl transition-all dark:bg-gray-800 border border-red-500/20">
        <div class="flex items-center gap-4 mb-4 text-red-600 dark:text-red-400">
            <div
                class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-red-100 sm:h-10 sm:w-10 dark:bg-red-900/40">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 class="text-xl font-medium leading-6 text-gray-900 dark:text-gray-100" id="modal-title">
                {{ title }}
            </h3>
        </div>

        <div class="mt-2 text-md text-gray-500 dark:text-gray-400">
            <p>
                {{ message }}
            </p>
        </div>

        <div class="mt-8 flex justify-end gap-3">
            <app-button variant="secondary" (click)="onCancel()">
                Cancelar
            </app-button>
            @if (!isLoading) {
            <app-button variant="danger" (click)="onConfirm()">
                Continuar de todos modos
            </app-button>
            } @else {
            <app-button variant="danger" (click)="onConfirm()">
                Cargando...
            </app-button>
            }
        </div>
    </div>
</div>
}
