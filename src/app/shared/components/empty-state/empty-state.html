<div
    class="bg-white p-12 rounded-2xl shadow-sm border border-slate-100 text-center flex flex-col items-center justify-center min-h-[300px]">
    <div
        class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4 border border-slate-100 shadow-sm">
        <lucide-icon [name]="icon" [size]="28" class="text-slate-400" [strokeWidth]="1.5"></lucide-icon>
    </div>
    <h3 class="text-lg font-bold text-slate-800 mb-1">{{ title }}</h3>
    <p class="text-slate-500 text-sm max-w-sm mx-auto">
        {{ description }}
    </p>
    @if (showAction) {
    <div class="mt-6">
        <ng-content></ng-content>
    </div>
    }
</div>
