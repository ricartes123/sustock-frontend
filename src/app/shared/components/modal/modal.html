@if (isOpen) {
<div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-0 bg-slate-900/40 backdrop-blur-sm transition-opacity">
    <!-- Backdrop click catcher -->
    <div class="fixed inset-0" (click)="onClose()"></div>

    <!-- Modal Panel -->
    <div
        class="relative bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh] z-10 transform transition-all">

        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-white">
            <h3 class="text-xl font-bold text-slate-800">
                {{ title }}
            </h3>
            <button (click)="onClose()"
                class="text-slate-400 hover:text-slate-600 transition-colors p-1.5 rounded-lg hover:bg-slate-50 flex-shrink-0">
                <lucide-icon name="x" [size]="20" [strokeWidth]="2"></lucide-icon>
            </button>
        </div>

        <!-- Scrollable Body -->
        <div class="overflow-y-auto p-6 flex-1 bg-white">
            <ng-content></ng-content>
        </div>

        <!-- Footer -->
        <div class="border-t border-slate-100 p-4 sm:px-6 flex items-center justify-end gap-3 bg-slate-50/50">
            <ng-content select="[modal-footer]"></ng-content>
        </div>

    </div>
</div>
}
