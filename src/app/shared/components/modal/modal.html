@if (isOpen) {
<div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-0 bg-slate-900/40 backdrop-blur-sm transition-opacity">
    <!-- Backdrop click catcher -->
    <div class="fixed inset-0" (click)="onClose()"></div>

    <!-- Modal Panel -->
    <div
        class="relative bg-surface rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh] z-10 transform transition-all">

        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-soft bg-surface">
            <h3 class="text-xl font-bold text-main">
                {{ title }}
            </h3>
            <button (click)="onClose()"
                class="text-faint hover:text-red-600 transition-colors p-1.5 rounded-lg hover:cursor-pointer hover:bg-card-hover flex-shrink-0">
                <lucide-icon name="x" [size]="20" [strokeWidth]="2"></lucide-icon>
            </button>
        </div>

        <!-- Scrollable Body -->
        <div class="overflow-y-auto p-6 flex-1 bg-surface">
            <ng-content></ng-content>
        </div>

        <!-- Footer -->
        <div class="border-t border-soft p-4 sm:px-6 flex items-center justify-end gap-3 bg-slate-50/50 dark:bg-slate-800/50">
            <ng-content select="[modal-footer]"></ng-content>
        </div>

    </div>
</div>
}
