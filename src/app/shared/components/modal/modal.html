@if (isOpen) {
<div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-0 bg-black/40 backdrop-blur-sm transition-opacity">
    <!-- Backdrop click catcher -->
    <div class="fixed inset-0" (click)="onClose()"></div>

    <div
        class="relative bg-surface rounded-2xl shadow-xl w-full overflow-hidden flex flex-col max-h-[90vh] z-10 transform transition-all {{maxWidth}} {{minHeight}}">

        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-soft bg-surface">
            <h3 class="text-xl font-bold text-main">
                {{ title }}
            </h3>
            <button (click)="onClose()"
                class="text-faint hover:text-red-500 transition-colors p-1.5 rounded-lg cursor-pointer hover:bg-red-500/10 flex-shrink-0">
                <lucide-icon name="x" [size]="20" [strokeWidth]="2"></lucide-icon>
            </button>
        </div>

        <!-- Scrollable Body -->
        <div class="overflow-y-auto p-6 flex-1 bg-surface">
            <ng-content></ng-content>
        </div>

        <!-- Footer -->
        <div class="border-t border-soft p-4 sm:px-6 flex items-center justify-end gap-3 bg-surface">
            <ng-content select="[modal-footer]"></ng-content>
        </div>

    </div>
</div>
}
