<div class="flex items-center justify-center gap-1 mt-6 text-sm">
  <!-- Botón Anterior -->
  @if (currentPage > 1) {
    <button 
      (click)="prevPage()" 
      class="flex items-center gap-1 px-3 py-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 font-medium transition-colors"
    >
      <lucide-icon name="chevron-left" [size]="16" [strokeWidth]="2"></lucide-icon>
      {{ 'COMMON.PREVIOUS' | translate }}
    </button>
  }

  <!-- Números de página -->
  @for (p of pages; track $index) {
    @if (p === '...') {
      <span class="px-2 py-2 text-slate-400 dark:text-slate-600">...</span>
    } @else {
      <button 
        (click)="goToPage(p)" 
        [class]="p === currentPage 
          ? 'w-9 h-9 flex items-center justify-center text-sm font-bold text-slate-900 bg-white border-2 border-blue-500 rounded-lg shadow-sm dark:bg-slate-950 dark:text-white dark:border-blue-400' 
          : 'w-9 h-9 flex items-center justify-center text-sm font-medium text-slate-400 hover:text-slate-700 dark:text-slate-500 dark:hover:text-slate-300 transition-colors'"
      >
        {{ p }}
      </button>
    }
  }

  <!-- Botón Siguiente -->
  @if (currentPage < totalPages) {
    <button 
      (click)="nextPage()" 
      class="flex items-center gap-1 px-3 py-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 font-medium transition-colors"
    >
      {{ 'COMMON.NEXT' | translate }}
      <lucide-icon name="chevron-right" [size]="16" [strokeWidth]="2"></lucide-icon>
    </button>
  }
</div>
