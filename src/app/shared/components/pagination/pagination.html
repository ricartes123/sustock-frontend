<div class="flex items-center justify-center gap-1 mt-6 text-sm">
  <!-- Botón Anterior -->
  <button (click)="prevPage()" [disabled]="currentPage === 1"
    [class]="currentPage === 1
      ? 'flex items-center gap-1 px-3 py-2 text-faint opacity-50 cursor-not-allowed font-medium'
      : 'cursor-pointer flex items-center gap-1 px-3 py-2 text-muted hover:text-main rounded-lg font-medium transition-colors'">
    <lucide-icon name="chevron-left" [size]="16" [strokeWidth]="2"></lucide-icon>
    {{ 'COMMON.PREVIOUS' | translate }}
  </button>

  <!-- Números de página -->
  <div class="flex gap-1">
    @for (p of pages; track $index) {
    @if (p === '...') {
    <span class="px-2 py-2 text-faint">...</span>
    } @else {
    <button (click)="goToPage(p)"
      [class]="p === currentPage
            ? 'cursor-pointer w-9 h-9 flex items-center justify-center text-sm font-bold text-primary-600 dark:text-primary-300 bg-card border-2 border-primary-600 dark:border-primary-400 rounded-lg shadow-sm'
            : 'cursor-pointer w-9 h-9 flex items-center justify-center text-sm font-medium text-muted border border-transparent hover:border-medium hover:bg-card-hover hover:text-main rounded-lg transition-all'">
      {{ p }}
    </button>
    }
    }
  </div>

  <!-- Botón Siguiente -->
  <button (click)="nextPage()" [disabled]="currentPage === totalPages"
    [class]="currentPage === totalPages
      ? 'flex items-center gap-1 px-3 py-2 text-faint opacity-50 cursor-not-allowed font-medium'
      : 'cursor-pointer flex items-center gap-1 px-3 py-2 text-muted hover:text-main rounded-lg font-medium transition-colors'">
    {{ 'COMMON.NEXT' | translate }}
    <lucide-icon name="chevron-right" [size]="16" [strokeWidth]="2"></lucide-icon>
  </button>
</div>
