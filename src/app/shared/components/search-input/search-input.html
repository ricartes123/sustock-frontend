<div class="relative w-full">
    <lucide-icon name="search" [size]="18"
        class="absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></lucide-icon>
    <input type="text" 
        [ngModel]="value" 
        (ngModelChange)="onValueChange($event)" 
        (keyup.enter)="onSearch()"
        (blur)="onTouched()"
        [placeholder]="placeholder" 
        class="w-full pl-11 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all">
</div>
