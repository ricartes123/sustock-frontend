<div class="relative w-full">
    <lucide-icon name="search" [size]="18"
        class="absolute left-2 top-1/2 -translate-y-1/2 text-faint pointer-events-none"></lucide-icon>
    <input type="text"
        [ngModel]="value"
        (ngModelChange)="onValueChange($event)"
        (keyup.enter)="onSearch()"
        (blur)="onTouched()"
        [placeholder]="placeholder"
        class="w-full pl-11 pr-4 py-2 bg-input border border-strong rounded-lg text-sm text-body placeholder:text-faint focus:outline-none focus:ring-2 focus:ring-primary-500/40 focus:border-primary-500 transition-all">
</div>
